<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connection Interrupted | LeadintelAI</title>
    <link rel="stylesheet" href="glass-theme.css">
</head>
<body style="background: #000; color: #fff; margin: 0; font-family: sans-serif; overflow: hidden;">
    
    <section class="offline-hero" id="power-screen" style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; background: #0c0d11; transition: filter 2s ease, background 2s ease, opacity 2s ease;">
        
        <!-- Premium Sketch Server Room SVG -->
        <div id="server-room-container" style="position: relative; width: 600px; height: 400px; margin-bottom: 40px; display: flex; align-items: center; justify-content: center;">
            <svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg" style="max-width: 100%; height: auto;">
                <defs>
                    <linearGradient id="rack-grad" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#1e2028"/>
                        <stop offset="100%" stop-color="#08090b"/>
                    </linearGradient>
                    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="2.5" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                </defs>

                <!-- Floor Lines (Perspective) -->
                <path d="M0 350 L600 350 M0 380 L600 380 M300 350 L300 400" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

                <!-- Server Rack 1 (Left) -->
                <path d="M50 320 L150 350 L150 100 L50 70 Z" fill="url(#rack-grad)" stroke="rgba(255,255,255,0.1)"/>
                <path d="M150 350 L180 340 L180 90 L150 100 Z" fill="#08090b" stroke="rgba(255,255,255,0.05)"/>
                
                <!-- Server Rack 2 (Center-Left) -->
                <path d="M200 340 L300 360 L300 80 L200 60 Z" fill="url(#rack-grad)" stroke="rgba(255,255,255,0.1)"/>
                <path d="M300 360 L330 350 L330 70 L300 80 Z" fill="#08090b" stroke="rgba(255,255,255,0.05)"/>

                <!-- Server Rack 3 (Center-Right) -->
                <path d="M350 350 L450 330 L450 60 L350 80 Z" fill="url(#rack-grad)" stroke="rgba(255,255,255,0.1)"/>
                <path d="M450 330 L480 340 L480 70 L450 60 Z" fill="#08090b" stroke="rgba(255,255,255,0.05)"/>
                
                <!-- LeadintelAI Branding on Racks -->
                <text x="70" y="90" fill="rgba(255,255,255,0.3)" font-family="sans-serif" font-weight="800" font-size="8" transform="skewY(15)">LeadintelAI</text>
                <text x="220" y="80" fill="rgba(255,255,255,0.3)" font-family="sans-serif" font-weight="800" font-size="10" transform="skewY(10)">LeadintelAI</text>
                <text x="370" y="80" fill="rgba(255,255,255,0.3)" font-family="sans-serif" font-weight="800" font-size="10" transform="skewY(-10)">LeadintelAI</text>

                <!-- LED Lights (Power On State) -->
                <g id="rack-leds">
                    <circle cx="80" cy="120" r="2" fill="#2563eb" class="led-blue" filter="url(#glow-blue)"/>
                    <circle cx="80" cy="140" r="2" fill="#2563eb" class="led-blue" filter="url(#glow-blue)"/>
                    <circle cx="90" cy="160" r="1.5" fill="#2563eb" class="led-blue"/>
                    
                    <circle cx="230" cy="110" r="2.5" fill="#2563eb" class="led-blue" filter="url(#glow-blue)"/>
                    <circle cx="230" cy="130" r="2" fill="#2563eb" class="led-blue"/>
                    <circle cx="240" cy="180" r="2" fill="#2563eb" class="led-blue" filter="url(#glow-blue)"/>

                    <circle cx="380" cy="110" r="2" fill="#2563eb" class="led-blue" filter="url(#glow-blue)"/>
                    <circle cx="380" cy="140" r="2" fill="#2563eb" class="led-blue"/>
                </g>
                
                <!-- Power-Off State LEDs (Hidden initially) -->
                <g id="rack-leds-off" opacity="0">
                    <circle cx="80" cy="120" r="2" fill="#ef4444"/>
                    <circle cx="230" cy="110" r="2.5" fill="#ef4444"/>
                    <circle cx="380" cy="110" r="2" fill="#ef4444"/>
                </g>
            </svg>
        </div>

        <div style="text-align: center; position: relative; z-index: 10; max-width: 600px;">
            <div style="display: inline-flex; align-items: center; gap: 10px; margin-bottom: 30px; padding: 8px 16px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 4px;">
                <span id="status-dot" style="width: 8px; height: 8px; border-radius: 50%; background: #2563eb; transition: background 2s;"></span>
                <span id="status-text" style="font-family: monospace; font-size: 0.7rem; color: var(--text-secondary); letter-spacing: 0.1em; text-transform: uppercase;">Signal: Strong / Connected</span>
            </div>

            <h1 style="font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 800; color: var(--text-primary); margin-bottom: 20px; line-height: 1.2;">Leadintel<span style="color: var(--accent-blue);">AI</span></h1>
            
            <p style="font-size: 1.1rem; color: var(--text-secondary); margin-bottom: 48px; line-height: 1.7; max-width: 480px; margin-left: auto; margin-right: auto; opacity: 0.8;">
                The Leadintel DataCloud link has been interrupted. We are standing by to re-establish the connection.
            </p>

            <button onclick="window.location.reload()" id="retry-btn" style="background: transparent; border: 1px solid var(--border-glass); color: var(--text-primary); padding: 14px 32px; border-radius: 6px; font-weight: 600; cursor: pointer; backdrop-filter: blur(10px); transition: 0.3s; opacity: 0; pointer-events: none; transform: translateY(10px);">
                Retry Signal Scan
            </button>
        </div>

        <style>
            .led-blue { animation: blink 2s infinite alternate; }
            @keyframes blink { from { opacity: 1; } to { opacity: 0.4; } }
            
            /* Power-Off Mode */
            .power-off {
                filter: grayscale(1) brightness(0.7);
                background: #000 !important;
            }
            .power-off #rack-leds { opacity: 0; }
            .power-off #rack-leds-off { opacity: 1; transition: opacity 2s; }
            .power-off #status-dot { background: #ef4444 !important; box-shadow: 0 0 10px #ef4444; }
            .power-off #status-text { color: #ef4444 !important; }
            .power-off #retry-btn { opacity: 1 !important; pointer-events: auto !important; transform: translateY(0) !important; }
            
            /* Recovery Flash */
            .recovery-flash {
                animation: flash 0.5s ease-out;
            }
            @keyframes flash {
                0% { filter: brightness(3); background: #fff; }
                100% { filter: brightness(1); background: #0c0d11; }
            }
        </style>

        <script>
            // The 2-Second Power-Off Sequence
            setTimeout(() => {
                document.getElementById('power-screen').classList.add('power-off');
                document.getElementById('status-text').innerText = 'Signal: Lost / Searching...';
            }, 2000);

            // Reconnection & Auto-Return Logic
            window.addEventListener('online', () => {
                // Return to Color
                document.getElementById('power-screen').classList.add('recovery-flash');
                document.getElementById('power-screen').classList.remove('power-off');
                document.getElementById('status-text').innerText = 'Re-establishing Link...';
                
                setTimeout(() => {
                    const lastUrl = localStorage.getItem('leadintel_last_url') || 'index.html';
                    console.log("Reconnecting to: " + lastUrl);
                    window.location.href = lastUrl;
                }, 800);
            });

            // Heartbeat check for recovery
            setInterval(() => {
                if (navigator.onLine && document.getElementById('power-screen').classList.contains('power-off')) {
                    window.dispatchEvent(new Event('online'));
                }
            }, 5000);
        </script>

    </section>

</body>
</html>
