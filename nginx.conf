server {
    listen 80;
    server_name leadintel.in www.leadintel.in;
    root /var/www/leadintel;
    index index.html;

    # Clean URLs — try file, then .html version
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Redirect .html URLs to clean versions
    location ~ ^(.+)\.html$ {
        return 301 $1;
    }

    # 404 fallback
    error_page 404 /404.html;
}
