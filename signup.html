<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Started | LeadintelAI</title>
    <link rel="stylesheet" href="linear-theme.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #000; }
        .auth-card {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            text-align: center;
        }
        .auth-header h1 { font-size: 1.5rem; font-weight: 500; margin-bottom: 8px; }
        .auth-header p { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 32px; }
        .auth-form { display: flex; flex-direction: column; gap: 16px; text-align: left; }
        .auth-form label { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
        .auth-input {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            padding: 12px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .auth-input:focus { border-color: var(--accent); }
        .btn-auth {
            background: #fff;
            color: #000;
            padding: 12px;
            border-radius: 6px;
            font-weight: 500;
            margin-top: 8px;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
        }
        .btn-auth:hover { background: #ddd; }
        .auth-divider {
            margin: 24px 0;
            display: flex; align-items: center; gap: 12px;
            color: var(--text-dim); font-size: 0.75rem;
        }
        .auth-divider::before, .auth-divider::after { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,0.08); }
        .btn-google {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-google:hover { background: rgba(255,255,255,0.08); }
    </style>
</head>
<body>
    <div class="auth-card">
        <a href="index.html" style="display: inline-block; margin-bottom: 24px;">
            <div class="ghost-mascot" style="width: 40px; height: 40px;">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <path class="ghost-body" d="M20,50 Q20,20 50,20 Q80,20 80,50 L80,80 Q70,75 60,80 Q50,85 40,80 Q30,75 20,80 Z" />
                    <ellipse class="ghost-eye" cx="40" cy="45" rx="4" ry="6" />
                    <ellipse class="ghost-eye" cx="60" cy="45" rx="4" ry="6" />
                </svg>
            </div>
        </a>
        <div class="auth-header">
            <h1>Create your account</h1>
            <p>Join India’s #1 B2B Sales Platform</p>
        </div>
        
        <form class="auth-form" action="index.html">
            <div style="display: flex; flex-direction: column; gap: 6px;">
                <label>Email Address</label>
                <input type="email" class="auth-input" placeholder="name@company.com" required>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px;">
                <label>Password</label>
                <input type="password" class="auth-input" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-auth">Sign Up</button>
        </form>

        <div class="auth-divider">OR</div>

        <button class="btn-google">
            <svg width="16" height="16" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            Continue with Google
        </button>

        <p style="font-size: 0.8rem; color: var(--text-dim); margin-top: 32px;">
            Already have an account? <a href="login.html" style="color: #fff;">Log in</a>
        </p>
    </div>
</body>
</html>
