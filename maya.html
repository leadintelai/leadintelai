<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeadintelAI · Maya</title>
<link rel="icon" type="image/svg+xml" href="leadintelai-logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--tx:#f8fafc;--tx2:#94a3b8;--tx3:#64748b;--ac:#2563eb;--acs:rgba(37,99,235,.16);--line:rgba(255,255,255,.08);--line-strong:rgba(255,255,255,.12);--g1:rgba(12,13,18,.75);--g2:rgba(10,11,16,.85);--sel:rgba(255,255,255,.06);--bub:rgba(18,20,28,.82);--elev:rgba(24,26,36,.94);--cg:#10b981;--cr:#ef4444;--co:#f59e0b;--cgb:rgba(16,185,129,.16);--crb:rgba(239,68,68,.16);--cob:rgba(245,158,11,.16);--ct:#38bdf8;--tintb:rgba(56,189,248,.12);--w1:rgba(37,99,235,.09);--w2:rgba(15,23,42,.65);--w3:rgba(139,0,0,.07);--ok:#10b981;--bad:#ef4444}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--tx:#f8fafc;--tx2:#94a3b8;--line:rgba(255,255,255,.08);--g1:rgba(12,13,18,.75);--g2:rgba(10,11,16,.85);--sel:rgba(255,255,255,.06);--bub:rgba(18,20,28,.82);--elev:rgba(24,26,36,.94);--cg:#10b981;--cr:#ef4444;--co:#f59e0b;--cgb:rgba(16,185,129,.16);--crb:rgba(239,68,68,.16);--cob:rgba(245,158,11,.16);--ct:#38bdf8;--tintb:rgba(56,189,248,.12);--w1:rgba(37,99,235,.09);--w2:rgba(15,23,42,.65);--w3:rgba(139,0,0,.07)}}
:root[data-theme="dark"]{--tx:#f8fafc;--tx2:#94a3b8;--line:rgba(255,255,255,.08);--g1:rgba(12,13,18,.75);--g2:rgba(10,11,16,.85);--sel:rgba(255,255,255,.06);--bub:rgba(18,20,28,.82);--elev:rgba(24,26,36,.94);--cg:#10b981;--cr:#ef4444;--co:#f59e0b;--cgb:rgba(16,185,129,.16);--crb:rgba(239,68,68,.16);--cob:rgba(245,158,11,.16);--ct:#38bdf8;--tintb:rgba(56,189,248,.12);--w1:rgba(37,99,235,.09);--w2:rgba(15,23,42,.65);--w3:rgba(139,0,0,.07)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.5 'Inter',-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased;overflow:hidden;background-color:#07080c;background-image:radial-gradient(55% 50% at 15% 15%,var(--w1),transparent 70%),radial-gradient(45% 45% at 85% 25%,var(--w2),transparent 70%),radial-gradient(50% 50% at 50% 95%,var(--w3),transparent 70%)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,0.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.018) 1px,transparent 1px);background-size:40px 40px;background-position:center center;mask-image:radial-gradient(circle at 50% 50%,black 40%,transparent 85%);-webkit-mask-image:radial-gradient(circle at 50% 50%,black 40%,transparent 85%);z-index:0}
button,input,textarea,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;text-align:left}
svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{position:relative;z-index:1;height:100%;display:grid;grid-template-columns:268px 1fr 300px;transition:grid-template-columns .55s cubic-bezier(.32,.72,0,1)}.app.nop{grid-template-columns:268px 1fr 0}
.drag{position:fixed;top:0;left:0;right:0;height:28px;-webkit-app-region:drag;z-index:5;pointer-events:none}
.glass{background:var(--g1);backdrop-filter:blur(36px) saturate(180%);-webkit-backdrop-filter:blur(36px) saturate(180%)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--tx2);flex:none;display:inline-block}
.grp{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--tx2);padding:14px 14px 5px}
.k{color:var(--tx2);font-size:11px}
/* sidebar */
.side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding-top:30px}
.sh{display:flex;align-items:center;padding:0 14px 4px;font-weight:600;font-size:14px}.sh button{margin-left:auto;padding:4px;border-radius:6px;color:var(--tx2)}.sh button:hover{background:var(--sel)}
.sh-brand{display:inline-flex;align-items:center;gap:6px;user-select:none}
.sh-logo-icon{width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex:none}
.sh-logo-icon img{width:100%;height:100%;object-fit:contain;filter:none!important}
.sh-logo-title{font-size:13.5px;font-weight:700;letter-spacing:-0.02em;color:var(--tx)}
.maya-badge{color:#8b0000;font-size:0.74rem;font-weight:700;letter-spacing:0.04em;margin-left:2px;text-shadow:none!important;line-height:1;display:inline-block}
.top-active-agent{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,0.04);border:1px solid var(--line);font-size:11.5px;user-select:none}
.top-agent-icon{width:14px;height:14px;display:flex;align-items:center;justify-content:center;flex:none}
.top-agent-icon img{width:100%;height:100%;object-fit:contain}
.top-agent-lead{font-weight:600;color:var(--tx2);letter-spacing:-0.01em;font-size:11px}
.top-agent-sep{color:var(--tx2);opacity:0.4;font-size:10px}
#agentNow{font-weight:700;letter-spacing:0.01em;text-shadow:none!important}
.welcome-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;background:rgba(139,0,0,0.08);border:1px solid rgba(139,0,0,0.22);margin:10px auto 14px}
.welcome-icon{width:17px;height:17px;display:flex;align-items:center;justify-content:center;flex:none}
.welcome-icon img{width:100%;height:100%;object-fit:contain}
.welcome-pill span:not(.maya-badge){font-size:11.5px;font-weight:700;color:var(--tx);letter-spacing:-0.01em}
.sc2{flex:1;overflow:auto;min-height:0;padding-bottom:10px}
.ar{display:flex;align-items:center;justify-content:space-between;padding:6px 14px;margin:0 6px;border-radius:7px;font-size:12px;cursor:pointer;transition:background .18s,transform .15s}.ar:hover{background:var(--sel)}.ar.on{background:var(--sel);font-weight:600}
.an{display:flex;align-items:center;gap:9px}.an>span:last-child{display:flex;flex-direction:column;line-height:1.25}.an b{font-weight:600;letter-spacing:.03em}
.ar small{font-size:10px;font-weight:600;letter-spacing:.05em;color:var(--tx2)}
.sub2{font-style:normal;color:var(--tx2);font-size:10.5px;white-space:nowrap}.sub2 .dot{width:6px;height:6px;margin-right:5px}
.hr{height:1px;background:var(--line);margin:10px 20px}
.card2{margin:0 10px;padding:10px 10px 8px;border-radius:12px;background:var(--bub);border:1px solid var(--line)}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;border-top:1px solid var(--line);padding-top:8px}.stats b{display:block;font-size:17px;font-weight:300;line-height:1}.stats span{font-size:9.5px;color:var(--tx2);letter-spacing:.04em}
.pill{display:flex;align-items:center;gap:7px;justify-content:center;margin-top:9px;padding:4px 8px;border-radius:99px;background:var(--acs);color:var(--ac);font-size:10.5px;font-weight:600}.pill .dot{width:6px;height:6px;background:var(--ac)}
.perf{padding:0 14px}
.call{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;padding:10px;border-radius:10px;background:var(--ac);color:#fff;font-weight:600;margin-bottom:12px;box-shadow:0 4px 14px rgba(10,132,255,.35);transition:.18s}.call:hover{filter:brightness(1.1);transform:translateY(-1px)}
.pr{margin-bottom:10px;font-size:10px;font-weight:700;color:var(--tx2)}.pr div:first-child{display:flex;justify-content:space-between;margin-bottom:4px}
.pbar{height:4px;border-radius:2px;background:var(--line)}.pbar i{display:block;height:100%;border-radius:2px;background:var(--ac)}
.sf{border-top:1px solid var(--line);padding:10px 12px}
.idb{display:flex;align-items:center;gap:10px}.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#1e293b,#0f172a);border:1px solid rgba(255,255,255,0.12);box-shadow:0 2px 8px rgba(0,0,0,0.35);color:#f8fafc;font-weight:700;display:grid;place-items:center;flex:none}
.idb b{font-size:13px}.chip2{font-size:8.5px;font-weight:700;letter-spacing:.05em;color:var(--ac);background:var(--acs);padding:1px 6px;border-radius:4px;margin-left:6px}
.pills{display:flex;gap:6px;margin-top:10px}.fp{flex:1;text-align:center;padding:6px 4px;border-radius:99px;background:var(--sel);font-size:10.5px;color:var(--tx2);transition:.2s}
body[data-v=speak] .pm{background:rgba(139,0,0,0.18);color:#ff6b6b;font-weight:600}
body[data-v=listen] .pg{background:var(--acs);color:var(--ac);font-weight:600}
/* center */
.center{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;position:relative;background:var(--g2);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%)}
.ctxb{display:flex;align-items:center;gap:10px;height:44px;flex:none;padding:0 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--tx2);flex-wrap:nowrap;overflow:hidden}
.ctxb .it{display:flex;align-items:center;gap:6px;white-space:nowrap}.ctxb .it b{color:var(--tx);font-weight:600}
.dv{width:1px;height:14px;background:var(--line)}.sp{flex:1}
.ib{padding:5px;border-radius:6px;color:var(--tx2)}.ib:hover{background:var(--sel);color:var(--tx)}
.empty{color:var(--tx2);padding:6px 10px;font-size:12px}
.chat{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:22px 0}
.col{max-width:760px;margin:0 auto;padding:0 22px}
.welcome{text-align:center;padding-top:3vh}
.orbw{position:relative;display:block;width:200px;height:200px;margin:0 auto 4px;padding:0;border:0;background:none;border-radius:50%;cursor:pointer}
.orbw canvas{width:100%;height:100%;display:block}
.welcome h1{font-size:27px;letter-spacing:-.02em;margin:0 0 4px}.welcome>p{color:var(--tx2);margin:0 0 16px}
.bdg{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}.bdg span{padding:4px 12px;border-radius:99px;background:var(--bub);border:1px solid var(--line);font-size:12px;color:var(--tx2)}.bdg b{color:var(--tx)}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;text-align:left}
.sug{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--bub);border:1px solid var(--line);transition:.18s}.sug:hover{border-color:var(--ac);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.si{width:36px;height:36px;border-radius:10px;background:var(--acs);color:var(--ac);display:grid;place-items:center;flex:none}.si svg{width:18px;height:18px}
.sug b{display:block;font-size:13px}.sug em{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.07em;color:var(--tx2)}
.msg{margin:0 0 16px;display:flex;flex-direction:column}.msg .who{font-size:11px;color:var(--tx2);margin:0 4px 3px}
.msg .b{white-space:pre-wrap;word-wrap:break-word;padding:9px 13px;border-radius:14px;max-width:88%}
.msg.u{align-items:flex-end}.msg.u .b{background:var(--ac);color:#fff}.msg.m .b{background:var(--bub);border:1px solid var(--line)}.msg.e .b{background:rgba(229,72,77,.12);color:var(--bad)}
.think{color:var(--tx2);padding:0 4px;font-size:12px}
.rich{white-space:normal!important}.rich p{margin:2px 0 8px}
.mets{display:flex;gap:16px;margin:6px 0 8px}.mets b{display:block;font-size:17px}.mets span{color:var(--tx2);font-size:11px}
.bar{display:grid;grid-template-columns:90px 1fr 36px;gap:8px;align-items:center;margin:3px 0}.bar i{display:block;height:8px;border-radius:4px;background:var(--ac)}.bar em{font-style:normal;color:var(--tx2);font-size:12px}
.rich pre{background:var(--sel);padding:10px;border-radius:8px;overflow-x:auto;font:11.5px/1.5 ui-monospace,Menlo,monospace;white-space:pre;margin:6px 0}
.tb{border-collapse:collapse;width:100%}.tb th,.tb td{text-align:left;padding:5px 8px;border-top:1px solid var(--line)}.tb th{color:var(--tx2);font-weight:600;font-size:11px}.scroll{overflow-x:auto}
.tm{display:flex;gap:9px;padding:6px 0;border-top:1px solid var(--line)}.tm .dot{margin-top:6px}
.ap2{border:1px solid var(--bad);border-radius:10px;padding:10px;margin-top:6px;background:rgba(229,72,77,.08)}
.fu{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chip{padding:3px 11px;border-radius:99px;background:var(--sel);font-size:12px}.chip:hover{background:var(--acs);color:var(--ac)}
.mic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--tx2)}.mic:hover{background:var(--sel)}body[data-v=listen] .mic{background:var(--bad);color:#fff}
.send{width:30px;height:30px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center}.send:disabled{opacity:.35;cursor:default}
/* right panel */
.panel{border-left:1px solid var(--line);padding:14px 12px 12px;overflow-x:hidden;overflow-y:auto;min-width:0;transition:opacity .4s ease .1s,transform .6s cubic-bezier(.34,1.3,.64,1),visibility 0s}
.panel>*{width:275px}
.app.nop .panel{opacity:0;transform:translateX(28px);visibility:hidden;pointer-events:none;transition:opacity .28s ease,transform .45s cubic-bezier(.4,0,.2,1),visibility 0s linear .55s}
.pc{background:var(--bub);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.pt{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--tx2);margin-bottom:9px}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.mcd{position:relative;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--sel);display:flex;flex-direction:column;gap:1px;transition:.18s}.mcd:hover{border-color:var(--ac)}.mcd.on{border-color:var(--ac);background:var(--acs)}.mcd.na{opacity:.55}
.ml{width:26px;height:26px;border-radius:8px;color:#fff;font-weight:700;display:grid;place-items:center;margin-bottom:5px;font-size:12px}
.mcd b{font-size:12px;line-height:1.2}.mcd em{font-style:normal;font-size:10.5px;color:var(--tx2)}.mcd u{text-decoration:none;font-size:11px;font-weight:700;margin-top:3px}
.mb{height:3px;border-radius:2px;background:var(--line);margin-top:3px}.mb i{display:block;height:100%;background:var(--ac);border-radius:2px}
.rw{display:flex;align-items:center;gap:9px;padding:6px 0}.rw+.rw{border-top:1px solid var(--line)}.rw .g{flex:1;min-width:0}.rw .g span{display:block;color:var(--tx2);font-size:11px}.rw small{color:var(--tx2);font-size:11px;font-weight:600}
.sk{display:grid;grid-template-columns:104px 1fr 28px;gap:8px;align-items:center;margin:5px 0;font-size:11.5px}.sk span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sk em{font-style:normal;color:var(--tx2);text-align:right}
.log{list-style:none;margin:0;padding:0;font-size:12px;color:var(--tx2)}.log li{padding:5px 0;border-top:1px solid var(--line)}.log li:first-child{border-top:0}.log i{font-style:normal;color:var(--tx)}
input.sw{appearance:none;-webkit-appearance:none;width:32px;height:19px;border-radius:99px;background:var(--sel);position:relative;cursor:pointer;transition:.2s;flex:none;margin:0}
input.sw:checked{background:var(--ok)}input.sw:before{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}input.sw:checked:before{left:15px}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.25);display:none;z-index:20;align-items:flex-start;justify-content:center;padding-top:12vh}.ov.show{display:flex}
.sheet,.pal{width:min(460px,92vw);border-radius:14px;background:var(--g2);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);box-shadow:0 24px 70px rgba(0,0,0,.35),0 0 0 .5px var(--line)}
.sheet{padding:18px}.sheet h2{margin:0 0 12px;font-size:16px}
.seg{display:flex;background:var(--sel);border-radius:8px;padding:2px;margin-bottom:14px}.seg button{flex:1;padding:3px;border-radius:6px;font-size:12px;text-align:center}.seg .on{background:var(--bub);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.f{margin-bottom:12px}.f label{display:block;font-size:12px;color:var(--tx2);margin-bottom:3px}
.f input,.f select{width:100%;padding:6px 9px;border-radius:7px;border:1px solid var(--line);background:var(--bub);outline:0}.f input:focus,.f select:focus{border-color:var(--ac)}.f input[type=checkbox]{width:auto;margin-right:7px}
.btn{background:var(--ac);color:#fff;padding:5px 14px;border-radius:7px;text-align:center}.btn.g{background:var(--sel);color:var(--tx)}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.pal{width:min(520px,92vw);overflow:hidden}.pal input{width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:13px 16px;font-size:15px;outline:0}
.pal .row{display:flex;justify-content:space-between;width:100%;padding:8px 16px}.pal .row.on{background:var(--sel)}.pal small{color:var(--tx2)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:rgba(30,30,34,.92);color:#fff;padding:7px 14px;border-radius:99px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}.toast.show{opacity:1}
/* search bar: circle -> pill morph, typed placeholder, attach */
.comp{padding:0 22px 18px;display:flex;flex-direction:column;align-items:center;gap:8px}
.quick-tools{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;max-width:760px;width:100%;padding:2px 4px 6px;scrollbar-width:none}
.quick-tools::-webkit-scrollbar{display:none}
.qbtn{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:14px;background:var(--bub);border:1px solid var(--line);font-size:11.5px;font-weight:500;color:var(--tx2);white-space:nowrap;cursor:pointer;transition:all .18s ease;box-shadow:0 1px 3px rgba(0,0,0,.04);user-select:none}
.qbtn:hover{color:var(--tx);background:var(--elev);border-color:var(--ac);transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,0,0,.08)}
.qbtn svg{width:13px;height:13px;stroke-width:1.9}
.files{display:flex;gap:6px;flex-wrap:wrap;width:100%;max-width:760px}
.fchip{display:flex;align-items:center;gap:6px;padding:3px 5px 3px 11px;border-radius:99px;background:var(--bub);border:1px solid var(--line);font-size:11.5px;animation:pop .32s cubic-bezier(.34,1.56,.64,1)}
.fchip button{width:17px;height:17px;border-radius:50%;display:grid;place-items:center;color:var(--tx2)}.fchip button:hover{background:var(--sel);color:var(--tx)}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.cbar{display:flex;align-items:center;gap:8px;min-height:52px;width:52px;max-width:760px;border-radius:26px;padding:0 8px 0 16px;background:var(--bub);border:1px solid var(--line);box-shadow:0 6px 24px rgba(0,0,0,.1);overflow:hidden;transition:width .8s cubic-bezier(.34,1.32,.64,1),transform .22s cubic-bezier(.4,0,.2,1),background .22s,border-color .2s,box-shadow .2s}
.cbar[data-s=mid]{width:min(56%,420px)}.cbar[data-s=full]{width:100%}
.cbar:focus-within{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs),0 6px 24px rgba(0,0,0,.1)}
.cbar.press{transform:scale(.985);background:var(--sel)}
.cbar .si2{width:18px;height:18px;color:var(--tx2);cursor:text;flex:none;transition:color .2s}.cbar:focus-within .si2{color:var(--ac)}
.cbar>*:not(.si2){opacity:0;pointer-events:none;transition:opacity .35s ease .3s,transform .35s cubic-bezier(.34,1.56,.64,1),background .2s,color .2s}
.cbar[data-s=full]>*:not(.si2){opacity:1;pointer-events:auto}
.cbar textarea{flex:1;min-width:0;border:0;outline:0;background:none;resize:none;max-height:140px;padding:6px 0;line-height:18px;font-size:14px}

.msg.m .b.rich.hg{background:none;border:0;padding:0;max-width:100%}

<script>
const $=s=>document.querySelector(s),ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap=s=>s?s[0].toUpperCase()+s.slice(1):'';
let API=ls.get('maya_api')||(location.port==='8787'?location.origin:'http://127.0.0.1:8787'),sid=null,ws=null,busy=false,pend=null,rec=null,viaVoice=false,speakOn=ls.get('maya_speak')==='1',curA='maya',oll={up:false,model:'',models:[]},D={up:false,sim:false,sum:{},skills:[],events:[],plugins:[],conns:[],mh:null,rep:null,today:0,health:null};
const AG=[['cipher','Cipher','Research','#38bdf8'],['root','Root','Code','#30a46c'],['ghost','Ghost','Automation','#e8912d'],['vault','Vault','Memory + Security','#e5484d']];
const nm=()=>ls.get('maya_name')||'Gaurav';
async function api(p,o){const r=await fetch(API+p,{headers:{'Content-Type':'application/json'},...o});if(!r.ok)throw new Error(r.status);return r.json().catch(()=>({}))}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2800)}

// ---- Offline Simulation Data ----
const MOCK_DATA={
  health:{status:'healthy',autonomy_level:'Autonomous Simulator',model_mode:'Local Simulation Engine'},
  sum:{total_skills:8,total_runs:142,learning_cycles:28,avg_skill_score:91},
  skills:[
    {skill_name:'lead_scoring',score:96,total_runs:48},
    {skill_name:'outreach_drafting',score:93,total_runs:35},
    {skill_name:'company_research',score:91,total_runs:27},
    {skill_name:'pipeline_automation',score:88,total_runs:18},
    {skill_name:'market_intel',score:85,total_runs:12},
    {skill_name:'code_generation',score:84,total_runs:9}
  ],
  events:(()=>{const ev=[],now=Date.now(),d8=864e5;for(let i=0;i<35;i++)ev.push({created_at:new Date(now-Math.floor(Math.random()*25)*d8).toISOString(),event_type:'skill_run',score_delta:2});return ev})(),
  plugins:[
    {id:'lead_scoring',name:'Lead Scoring Engine',description:'Real-time scoring & priority ranking',is_enabled:true},
    {id:'chart_plugin',name:'Interactive Charts',description:'Visual charts, rings & data breakdowns',is_enabled:true},
    {id:'email_writer',name:'Cold Email Drafter',description:'Personalized hyper-converting email generator',is_enabled:true},
    {id:'file_reader',name:'Deep File Analyzer',description:'Extracts insights from uploaded documents',is_enabled:true},
    {id:'code_debugger',name:'Code Pilot',description:'Python/JS scripts, pipelines, and fixes',is_enabled:true},
    {id:'meeting_brief',name:'Meeting Brief Prep',description:'Executive context & talking points',is_enabled:true}
  ],
  conns:[
    {id:'telegram',name:'Telegram Bot',status:'connected'},
    {id:'whatsapp',name:'WhatsApp Connector',status:'connected'},
    {id:'drive',name:'Google Drive',status:'connected'},
    {id:'gmail',name:'Gmail Connector',status:'connected'},
    {id:'notion',name:'Notion Workspace',status:'standby'}
  ],
  mh:{
    model_health:'Optimal (Local Sim)',
    model_mode:'Simulation Active',
    selected_local_model:'llama3.2:latest',
    all_profiles:[
      {id:'llama3.2:latest',display_name:'Llama 3.2 8B (Fast)',provider:'Local / Ollama',size_gb:4.9,score:96,available:true,best_for:['General reasoning','Quick chat','Executive summary']},
      {id:'qwen2.5-coder:7b',display_name:'Qwen 2.5 Coder (Code)',provider:'Local / Ollama',size_gb:4.7,score:94,available:true,best_for:['Python code','Refactoring','Data science']},
      {id:'mistral:7b',display_name:'Mistral Instruct (Analysis)',provider:'Local / Ollama',size_gb:4.1,score:91,available:true,best_for:['Lead analysis','Email drafting']},
      {id:'deepseek-r1:8b',display_name:'DeepSeek R1 (Reasoning)',provider:'Local / Ollama',size_gb:4.9,score:95,available:true,best_for:['Deep reasoning','Strategy formulation']}
    ]
  },
  rep:{completed_tasks:19,failed_tasks:0},
  today:5,
  oll:{up:true,model:'llama3.2:8b',models:['llama3.2:8b','qwen2.5-coder:7b','mistral:7b','deepseek-r1:8b']}
};

// ---- live data + offline simulation ----
async function loadAll(){
  const g=p=>api(p).catch(()=>null);
  let [sm,sk,ev,pl,cn,mh,dr,ss,lo,h]=await Promise.all(['/api/learning/mastermind-summary','/api/learning/skills','/api/learning/events','/api/plugins','/api/connectors','/api/models/health','/api/learning/daily-report','/api/chat/sessions','/api/models/local','/api/health'].map(g));
  const forceSim=ls.get('maya_sim_mode')==='1';
  if(!h||forceSim){
    const savedPl=ls.get('maya_sim_plugins'),savedCn=ls.get('maya_sim_conns'),simModel=ls.get('maya_sim_model')||MOCK_DATA.oll.model;
    const simPl=savedPl?JSON.parse(savedPl):MOCK_DATA.plugins,simCn=savedCn?JSON.parse(savedCn):MOCK_DATA.conns;
    const simSess=JSON.parse(ls.get('maya_sim_sessions')||'[]');
    D={up:true,sim:true,health:MOCK_DATA.health,sum:MOCK_DATA.sum,skills:MOCK_DATA.skills,events:MOCK_DATA.events,plugins:simPl,conns:simCn,mh:{...MOCK_DATA.mh,selected_local_model:simModel},rep:MOCK_DATA.rep,today:simSess.length||MOCK_DATA.today};
    oll={up:true,model:simModel,models:MOCK_DATA.oll.models};
  }else{
    D={up:true,sim:false,health:h,sum:sm?.summary||{},skills:sk?.skills||[],events:ev?.events||[],plugins:Array.isArray(pl)?pl:[],conns:Array.isArray(cn)?cn:[],mh,rep:dr?.report,today:(ss?.Today||[]).length};
    oll=lo?{up:!!lo.available,model:lo.selected_model||'',models:lo.models||[]}:{up:false,model:'',models:[]};
  }
  drawAll()}
function drawAll(){drawAgents(curA);drawSvc();drawIntel();drawPerf();drawCtx();drawPanel();drawIdent();if($('#msgs .welcome'))welcome(true)}

// ---- sidebar ----
function drawAgents(a){curA=a||'maya';
  const row=(on,c,n,st,sub,id)=>`<div class="ar ${on?'on':''}" data-ag="${id||'maya'}" title="Activate ${n} specialist"><span class="an"><span class="dot" style="background:${c};${on?'box-shadow:0 0 8px '+c:''}"></span><span><b>${n}</b>${sub||''}</span></span><small>${st}</small></div>`;
  $('#agents').innerHTML=row(curA==='maya','var(--ac)','MAYA','CORE',`<i class="sub2"><span class="dot" style="background:${oll.up?'var(--ok)':'var(--bad)'}"></span>${oll.up?(D.sim?'Ollama · '+esc(oll.model)+' (Sim)':'Ollama · '+esc(oll.model)):'Ollama offline'}</i>`,'maya')+AG.map(g=>row(curA===g[0],g[3],g[1].toUpperCase(),curA===g[0]?'WORKING':'STANDBY','',g[0])).join('')}
$('#agents').addEventListener('click',e=>{const r=e.target.closest('[data-ag]');if(!r)return;const agId=r.dataset.ag;drawAgents(agId);const found=AG.find(x=>x[0]===agId);const an=$('#agentNow');an.textContent=found?found[1]:'Maya';an.style.color=(!found||found[1]==='Maya')?'#8b0000':'var(--tx)';toast(`Active Specialist: ${found?found[1]:'Maya'} (${found?found[2]:'Core'})`);$('#inp').focus()});
function drawSvc(){const tg=D.conns.find(c=>/telegram/i.test(c.id));
  const r=(c,n,s,col)=>`<div class="ar"><span class="an"><span class="dot" style="background:${c}"></span><b style="font-weight:500;letter-spacing:0">${n}</b></span><small style="color:${col||'var(--tx2)'}">${s}</small></div>`;
  $('#svc').innerHTML=r(tg&&tg.status==='connected'?'var(--ok)':'var(--tx2)','Telegram Bot',tg?tg.status.toUpperCase():'NOT SET')+r('var(--tx2)','Reel Engine','IDLE')+r(D.up?'var(--ok)':'var(--bad)','Backup Engine',D.up?(D.sim?'SIMULATED':'HEALTHY'):'OFFLINE',D.up?'var(--ok)':'var(--bad)')}
/* ===== Maya Intelligence: activity history <-> skill radar (smooth morph) ===== */

function inWin(n,dir){if(n===IN.win)return;IN.win=n;IN.lab.dir=dir;inSet()}
function inSet(){
  const key=d=>d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(),cnt={};let old=null;
  (D.events||[]).forEach(e=>{const d=new Date(e.created_at);if(isNaN(d))return;cnt[key(d)]=(cnt[key(d)]||0)+1;if(!old||d<old)old=d});

  IN.tgt=IN.dates.map(d=>cnt[key(d)]||0);IN.tM=Math.max(4,...IN.tgt);

function inDraw(dt){

  const dpr=Math.min(window.devicePixelRatio||1,2);if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}

  IN.cM+=(IN.tM-IN.cM)*k;IN.m+=(IN.view-IN.m)*(RM2?1:Math.min(1,dt*3));IN.lab.t=Math.min(1,IN.lab.t+dt*3.5);

  const m=IN.m,e=m*m*(3-2*m),h=262-47*e,top=14,baseY=H-24,padL=12,padR=12,cx=W/2,cy=H/2-1,R=Math.min((W-132)/2,(H-44)/2),sx=i=>padL+i*(W-padL-padR)/5;
  const P=[];for(let i=0;i<6;i++){
    const ax=sx(i),ay=baseY-(IN.cur[i]/IN.cM)*(baseY-top-6),th=-Math.PI/2+i*Math.PI/3,r=R*IN.curS[i]/100,rx=cx+r*Math.cos(th),ry=cy+r*Math.sin(th);
    P.push([ax+(rx-ax)*e,ay+(ry-ay)*e])}

  c.lineWidth=1;c.strokeStyle=IN.cs[1];
  c.globalAlpha=1-e;if(e<1)for(let j=0;j<4;j++){const y=top+(baseY-top)*j/3;c.beginPath();c.moveTo(padL-4,y);c.lineTo(W-padR+4,y);c.stroke()}
  c.globalAlpha=e;if(e>0){for(let q=1;q<=3;q++){c.beginPath();for(let i=0;i<6;i++){const th=-Math.PI/2+i*Math.PI/3,x=cx+R*q/3*Math.cos(th),y=cy+R*q/3*Math.sin(th);i?c.lineTo(x,y):c.moveTo(x,y)}c.closePath();c.stroke()}
    for(let i=0;i<6;i++){const th=-Math.PI/2+i*Math.PI/3;c.beginPath();c.moveTo(cx,cy);c.lineTo(cx+R*Math.cos(th),cy+R*Math.sin(th));c.stroke()}}

  const g=c.createLinearGradient(0,top,0,baseY);g.addColorStop(0,`hsla(${h},90%,64%,${.45-.15*e})`);g.addColorStop(1,`hsla(${h},90%,64%,${.04+.2*e})`);

  c.beginPath();trace();c.stroke();c.globalAlpha=e;c.beginPath();c.moveTo(P[5][0],P[5][1]);c.lineTo(P[0][0],P[0][1]);c.stroke();c.globalAlpha=1;c.shadowBlur=0;
  P.forEach(p=>{c.beginPath();c.arc(p[0],p[1],3.4,0,7);c.fillStyle='#fff';c.fill();c.lineWidth=1.6;c.strokeStyle=`hsl(${h} 90% 64%)`;c.stroke()});
  c.fillStyle=IN.cs[0];c.font='500 9px -apple-system,BlinkMacSystemFont,sans-serif';c.textBaseline='middle';c.textAlign='center';

let inLast=0;
function inLoop(ts){const dt=Math.min((ts-inLast)/1000||0,.05);inLast=ts;

    if(IN.view===0&&IN.phase>3.4){IN.phase=0;if(IN.win<Math.min(IN.max,2))inWin(IN.win+1,1);else inView(1)}

  inDraw(dt);requestAnimationFrame(inLoop)}

  sds.forEach((s,k)=>{s.classList.remove('on','out');if(k===prev&&k!==j&&!fresh)s.classList.add('out')});v.sl=j;
  requestAnimationFrame(()=>requestAnimationFrame(()=>sds[j].classList.add('on')));card.querySelectorAll('.cvd').forEach((d,k)=>d.classList.toggle('cur',k===j))}
function cvTick(v){clearTimeout(v.tm);if(v.stop||v.hover||RM2||!v.el||!document.body.contains(v.el))return;
  v.tm=setTimeout(()=>{if(document.hidden||v.hover||v.stop){cvTick(v);return}const n=v.el.querySelectorAll('.cvk')[v.idx].querySelectorAll('.cvsd').length;
    if(v.sl<n-1)cvGo(v,v.sl+1);else if(v.idx<v.n-1)cvFocus(v,v.idx+1);else{v.stop=true;return}cvTick(v)},3200)}
async function addCollection(kind){

  addResp({response_type:'collection',agent_id:'maya',data:{text:({keys:'Here are your API keys.',apps:'Here are your connected apps.',plugins:'Here are your plugins.',sample:'Here is a sample of how your keys will look.'})[kind]||'Here you go.',collection:{loading:kind,title:({keys:'API keys',apps:'Connected apps',plugins:'Plugins',sample:'Sample · API keys'})[kind]}}});
  const el=[...document.querySelectorAll('.cv')].pop(),t0=performance.now();let c;
  try{c=await cvLoad(kind)}catch(e){c={title:'Something went wrong',error:e&&e.name==='TypeError'?"Can't reach Maya's backend on "+API+'.':e.message,kind}}
  await new Promise(r=>setTimeout(r,Math.max(0,800-(performance.now()-t0))));cvFill(el,c,kind)}
function cvFill(el,c,kind){const v=CV[el.dataset.v];if(!v||!document.body.contains(el))return;clearTimeout(v.tm);v.coll=c;v.kind=kind||v.kind;v.stop=false;v.idx=0;v.sl=0;el.classList.remove('go');
  el.querySelector('.cvh b').textContent=c.title||'';el.querySelector('.cvsm').textContent=c.summary||'';el.querySelector('.cvb').innerHTML=cvStage(c);if(c.items)cvStart(v);$('#chat').scrollTop=1e9}
function cvNotice(ks){welcome(false);const bad=!ks.to,d=document.createElement('div');d.className='msg m';
  d.innerHTML=`<div class="cvn ${bad?'bad':'warn'}"><span class="cvl">${cvLogo(ks.logo||ks.provider_id||'key')}</span><div><b>${esc(bad?'All '+(ks.provider||'API')+' keys are exhausted':(ks.from||'A key')+' ran out')}</b><div class="k">${esc(bad?'Add another key to keep going.':(ks.provider||'The provider')+' is now using '+ks.to+'.')}</div></div></div>`;$('#msgs').append(d);$('#chat').scrollTop=1e9}
const cvUser=v=>{v.stop=true;fxTick(0,'tick')};
document.addEventListener('click',e=>{const el=e.target.closest&&e.target.closest('.cv');if(!el)return;const v=CV[el.dataset.v];if(!v)return;
  if(v.moved){v.moved=false;return}
  if(e.target.closest('.cvrt')){const k=v.kind||'keys';el.querySelector('.cvb').innerHTML=cvSkel();cvLoad(k).then(c=>cvFill(el,c,k)).catch(x=>cvFill(el,{title:'Something went wrong',error:x&&x.name==='TypeError'?"Can't reach Maya's backend on "+API+'.':x.message},k));return}
  const ab=e.target.closest('.cvab');if(ab){const a=v.coll.items[v.idx].actions[+ab.dataset.a];v.stop=true;if(a&&a.connect)addConnect(a.connect);return}
  const dt=e.target.closest('.cvd');if(dt){cvUser(v);cvGo(v,+dt.dataset.j);return}
  const k=e.target.closest('.cvk');if(k&&!k.classList.contains('sk')){const i=+k.dataset.i;if(i!==v.idx){cvUser(v);cvFocus(v,i)}}});
document.addEventListener('pointerdown',e=>{const s=e.target.closest&&e.target.closest('.cvs');if(!s||e.button>0||e.target.closest('button'))return;const el=s.closest('.cv'),v=CV[el.dataset.v];if(!v||!v.n)return;
  const inSl=!!e.target.closest('.cvk.on .cvsl'),tr=s.querySelector('.cvt'),m=/translateX\((-?[\d.]+)px\)/.exec(tr.style.transform),tx0=m?+m[1]:0,d={x0:e.clientX,lx:e.clientX,lt:performance.now(),vx:0,moved:false};
  const mv=ev=>{const dx=ev.clientX-d.x0;if(!d.moved&&Math.abs(dx)<6)return;
    if(!d.moved){d.moved=true;v.moved=true;if(!inSl){s.classList.add('drag');try{s.setPointerCapture(e.pointerId)}catch(x){}}}
    const now=performance.now(),dt=now-d.lt;if(dt>0){d.vx=.7*d.vx+.3*((ev.clientX-d.lx)/dt);d.lx=ev.clientX;d.lt=now}
    if(!inSl){const max=Math.max(0,cvTrack(v.n)+32-s.clientWidth);let t=tx0+dx;if(t>0)t*=.35;else if(t<-max)t=-max+(t+max)*.35;tr.style.transform='translateX('+t+'px)'}};
  const up=ev=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);s.classList.remove('drag');
    if(!d.moved)return;setTimeout(()=>{v.moved=false},60);v.stop=true;const dx=ev.clientX-d.x0;
    if(inSl){if(Math.abs(dx)>36||Math.abs(d.vx)>.4){fxTick(0,'tick');cvGo(v,v.sl+(dx<0?1:-1))}return}
    const r=s.getBoundingClientRect(),cx=r.left+r.width/2;let best=v.idx,bd=1e9;
    [...el.querySelectorAll('.cvk')].forEach((k,i)=>{const b=k.getBoundingClientRect(),dd=Math.abs(b.left+b.width/2-cx);if(dd<bd){bd=dd;best=i}});
    if(Math.abs(d.vx)>.45&&best===v.idx)best=Math.max(0,Math.min(v.n-1,v.idx+(d.vx<0?1:-1)));
    if(best!==v.idx)fxTick(0,'tick');cvFocus(v,best)};
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up)});
document.addEventListener('wheel',e=>{const s=e.target.closest&&e.target.closest('.cvs');if(!s)return;const v=CV[s.closest('.cv').dataset.v];if(!v||!v.n||Math.abs(e.deltaX)<=Math.abs(e.deltaY))return;

// ---- voice ----
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function orb(s){document.body.dataset.v=s;const an=$('#agentNow');an.textContent={listen:'Listening',think:'Thinking',speak:'Speaking'}[s]||'Maya';an.style.color=s?'var(--ac)':'#8b0000';$('#pgn').textContent=nm()}
function listen(){if(rec){rec.stop();return}if(!SR){toast('Voice input needs Safari or Chrome');return}
  if(window.speechSynthesis)speechSynthesis.cancel();
  rec=new SR();rec.lang=navigator.language||'en-US';rec.interimResults=true;
  rec.onstart=()=>orb('listen');
  rec.onresult=e=>{$('#inp').value=[...e.results].map(r=>r[0].transcript).join('');sync();grow();if(e.results[e.results.length-1].isFinal){viaVoice=true;send()}};
  rec.onerror=()=>toast('Microphone blocked. Allow it in System Settings, Privacy and Security, Microphone');
  rec.onend=()=>{rec=null;if(!busy)orb('')};
  rec.start()}
function speak(t){const on=(speakOn||viaVoice)&&t;viaVoice=false;if(!on||!window.speechSynthesis){orb('');return}
  const u=new SpeechSynthesisUtterance(t),v=speechSynthesis.getVoices().find(x=>/Samantha|Ava|Allison|Serena/.test(x.name));if(v)u.voice=v;
  u.onstart=()=>orb('speak');u.onend=u.onerror=()=>orb('');speechSynthesis.cancel();speechSynthesis.speak(u)}
$('#mic').onclick=listen;document.addEventListener('click',e=>{if(e.target.closest('#talk')||e.target.closest('#callBtn'))listen()});

$('#save').onclick=async()=>{FX.on=$('#fx').checked;ls.set('maya_fx',FX.on?'1':'0');speakOn=$('#spk').checked;ls.set('maya_speak',speakOn?'1':'0');ls.set('maya_theme',$('#theme').value);applyTheme($('#theme').value);ls.set('maya_name',$('#uname').value.trim()||'Gaurav');

  const u=$('#apiUrl').value.trim();if(u&&u!==API){API=u;ls.set('maya_api',u)}

const CMD=[['New chat','⌘N',newChat],['Preview chart types','',gDemo],['Preview choice picker','',pkDemo],['View all API keys','',()=>addCollection('keys')],['View connected apps','',()=>addCollection('apps')],['View plugins','',()=>addCollection('plugins')],['Preview key pool (sample)','',()=>addCollection('sample')],['Add an API key','',()=>addConnect({kind:'key'})],['Connect an app','',()=>addConnect({kind:'app'})],['Settings','⌘,',openSet],['Show or hide side panel','',togglePanel],['Refresh data','',()=>{loadAll();toast('Refreshed')}],['Download backup','',backup]];

function openPal(){$('#palOv').classList.add('show');$('#palIn').value='';pl=CMD;pi=0;drawPal();$('#palIn').focus()}
