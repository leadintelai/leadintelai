<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="roundClip">
      <rect x="0" y="0" width="400" height="400" rx="90" ry="90"/>
    </clipPath>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0c1e35"/>
      <stop offset="100%" stop-color="#0a3040"/>
    </linearGradient>
    <linearGradient id="upG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="loG" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="arG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="capG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#roundClip)">
    <!-- Background -->
    <rect width="400" height="400" fill="url(#bgG)"/>
    <rect width="400" height="400" rx="90" ry="90" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="4"/>

    <!-- Arrowhead front face (drawn behind arms) -->
    <polygon points="258,88  358,200  258,312" fill="url(#arG)"/>

    <!-- 3D cap — top surface of arrowhead -->
    <polygon points="258,68  258,88  358,200  336,162" fill="url(#capG)"/>

    <!-- Lower arm -->
    <polygon points="162,218  262,218  150,354  48,354" fill="url(#loG)"/>

    <!-- Upper arm — FLOATING (gap of 36px between arms is the VS Code trick) -->
    <polygon points="48,46  150,46  262,182  160,182" fill="url(#upG)"/>
  </g>
</svg>
